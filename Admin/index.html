<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>市政设施管理系统 - 登录</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style1.css" />
  </head>

  <body>
    <div class="login-container">
      <!-- 登录框 -->
      <div class="login-box">
        <!-- 系统标题 -->
        <div class="title">
          <h1>市政设施管理系统</h1>
          <p>Municipal Facility Management System</p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm">
          <div class="input-group">
            <label>用户名</label>
            <input
              type="text"
              id="username"
              placeholder="请输入用户名"
              autocomplete="off"
              required
            />
          </div>

          <div class="input-group">
            <label>密码</label>
            <input
              type="password"
              id="password"
              placeholder="请输入密码"
              required
            />
          </div>

          <button type="submit" id="loginBtn">登录</button>

          <!-- 切换入口 -->
          <div class="switch-entry">
            <a href="/User/login.html">返回用户端登录</a>
          </div>
        </form>

        <!-- 底部信息 -->
        <div class="footer-info">
          <p>技术支持：城市管理信息中心</p>
          <p>服务热线：12345</p>
        </div>
      </div>

      <!-- 页面底部 -->
      <div class="copyright">
        Copyright © 2026 市政设施管理系统 All Rights Reserved
      </div>
    </div>

    <!-- JS -->
    <script src="/js/login1.js"></script>
  </body>
</html>
