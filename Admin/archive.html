<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>档案管理 - 市政设施管理系统</title>

    <link rel="stylesheet" href="/css/style1.css" />
  </head>

  <body>
    <div class="admin-container">
      <!-- 左侧菜单 -->
      <aside class="sidebar">
        <div class="logo">
          <h2>市政设施管理系统</h2>
        </div>

        <ul class="menu">
          <li><a href="/Admin/admin.html">🏠 首页</a></li>
          <li><a href="/Admin/user.html">👤 用户管理</a></li>
          <li><a href="/Admin/repair.html">📝 工单管理</a></li>
          <li><a href="/Admin/facility.html">🔧 设施管理</a></li>
          <li><a href="/Admin/statistics.html">📊 数据统计</a></li>
          <li class="active"><a href="/Admin/archive.html">📁 档案管理</a></li>
          <li><a href="/Admin/quality.html">⭐ 服务质量</a></li>
        </ul>
      </aside>

      <!-- 主体 -->
      <main class="main-content">
        <!-- 顶部栏 -->
        <header class="topbar">
          <div class="welcome">档案管理</div>

          <div class="admin-info">
            <img src="/images/avatar.png" alt="管理员" />
            <span>管理员</span>
          </div>
        </header>

        <section class="content">
          <!-- 筛选区 -->
          <div class="table-box">
            <div class="table-title">历史工单查询</div>

            <div class="filter-bar">
              <input type="text" placeholder="工单编号" />
              <select>
                <option>全部类型</option>
                <option>路灯</option>
                <option>道路</option>
                <option>井盖</option>
                <option>垃圾桶</option>
              </select>

              <input type="date" />
              <input type="date" />

              <button class="btn">查询</button>
              <button class="btn reset">重置</button>
            </div>
          </div>

          <!-- 表格 -->
          <div class="table-box" style="margin-top: 20px">
            <div class="table-title">归档工单列表</div>

            <table>
              <thead>
                <tr>
                  <th>工单编号</th>
                  <th>设施类型</th>
                  <th>报修人</th>
                  <th>维修人员</th>
                  <th>完成时间</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>RP10001</td>
                  <td>路灯</td>
                  <td>张三</td>
                  <td>李师傅</td>
                  <td>2026-06-12</td>
                  <td><span class="tag success">已归档</span></td>
                  <td><button class="link-btn">查看</button></td>
                </tr>

                <tr>
                  <td>RP10002</td>
                  <td>井盖</td>
                  <td>李四</td>
                  <td>王师傅</td>
                  <td>2026-06-10</td>
                  <td><span class="tag success">已归档</span></td>
                  <td><button class="link-btn">查看</button></td>
                </tr>

                <tr>
                  <td>RP10003</td>
                  <td>垃圾桶</td>
                  <td>王五</td>
                  <td>赵师傅</td>
                  <td>2026-06-08</td>
                  <td><span class="tag success">已归档</span></td>
                  <td><button class="link-btn">查看</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/admin.js"></script>
  </body>
</html>
