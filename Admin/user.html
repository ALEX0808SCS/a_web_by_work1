    <title>用户管理 - 市政设施管理系统</title>

    <link rel="stylesheet" href="/css/style1.css" />
  </head>

  <body>
    <div class="admin-container">
      <!-- 左侧菜单 -->
      <aside class="sidebar">
        <div class="logo">
          <h2>市政设施管理系统</h2>
        </div>

        <ul class="menu">
          <li>
            <a href="/Admin/admin.html">🏠 首页</a>
          </li>

          <li class="active">
            <a href="/Admin/user.html">👤 用户管理</a>
          </li>

          <li>
            <a href="/Admin/repair.html">📝 工单管理</a>
          </li>

          <li>
            <a href="/Admin/facility.html">🔧 设施管理</a>

          <li>
            <a href="/Admin/statistics.html">📊 数据统计</a>

          <li>

          </li>
          <li>
            <a href="/Admin/quality.html">⭐服务质量</a>
          </li>
        </ul>
      </aside>

      <!-- 主体 -->
      <main class="main-content">
        <header class="topbar">
          <div class="welcome">用户管理</div>

          <div class="admin-info">
            <img src="images/avatar.png" alt="管理员" />
            <span>管理员</span>
          </div>
        </header>

        <section class="content">
          <!-- 查询区域 -->
          <div class="table-box">
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
                flex-wrap: wrap;
                gap: 10px;
              "
            >
              <div>
                <input type="text" placeholder="请输入用户名" />

                <button class="btn btn-primary">查询</button>
              </div>

              <button class="btn btn-success">添加用户</button>
            </div>

            <!-- 用户表格 -->
            <table>
              <thead>
                <tr>
                  <th>用户编号</th>
                  <th>用户名</th>
                  <th>姓名</th>
                  <th>联系电话</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>U1001</td>
                  <td>zhangsan</td>
                  <td>张三</td>
                  <td>13800000001</td>
                  <td>普通用户</td>
                  <td>
                    <span class="status status-finish"> 正常 </span>
                  </td>

                  <td>
                    <button class="btn btn-warning">编辑</button>

                    <button class="btn btn-danger">删除</button>
                  </td>
                </tr>

                <tr>
                  <td>U1002</td>
                  <td>lisi</td>
                  <td>李四</td>
                  <td>13800000002</td>
                  <td>普通用户</td>
                  <td>
                    <span class="status status-finish"> 正常 </span>
                  </td>

                  <td>
                    <button class="btn btn-warning">编辑</button>

                    <button class="btn btn-danger">删除</button>
                  </td>
                </tr>

                <tr>
                  <td>U1003</td>
                  <td>wangwu</td>
                  <td>王五</td>
                  <td>13800000003</td>
                  <td>维修人员</td>
                  <td>
                    <span class="status status-process"> 在线 </span>
                  </td>

                  <td>
                    <button class="btn btn-warning">编辑</button>

                    <button class="btn btn-danger">删除</button>
                  </td>
                </tr>

                <tr>
                  <td>U1004</td>
                  <td>zhaoliu</td>
                  <td>赵六</td>
                  <td>13800000004</td>
                  <td>管理员</td>
                  <td>
                    <span class="status status-review"> 忙碌 </span>
                  </td>

                  <td>
                    <button class="btn btn-warning">编辑</button>

                    <button class="btn btn-danger">删除</button>
                  </td>
                </tr>

                <tr>
                  <td>U1005</td>
                  <td>chenqi</td>
                  <td>陈七</td>
                  <td>13800000005</td>
                  <td>普通用户</td>
                  <td>
                    <span class="status status-close"> 禁用 </span>
                  </td>

                  <td>
                    <button class="btn btn-warning">编辑</button>

                    <button class="btn btn-danger">删除</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/js/admin.js"></script>
  </body>
</html>
