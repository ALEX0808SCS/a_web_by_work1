<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>市政设施报修平台 - 用户登录</title>

    <link rel="stylesheet" href="/css/style2.css" />
  </head>

  <body>
    <!-- 顶部导航 -->
    <header class="header">
      <div class="logo">
        <h2>市政设施报修平台</h2>
      </div>

      <nav>
        <a href="#">首页</a>

        <a href="#">平台公告</a>

        <a href="#">帮助中心</a>

        <a href="#">联系我们</a>
      </nav>
    </header>

    <!-- 登录区域 -->
    <section class="login-section">
      <div class="login-box">
        <h1>用户登录</h1>

        <p class="subtitle">欢迎使用市政设施报修平台</p>

        <form id="loginForm">
          <div class="input-group">
            <label>手机号</label>

            <input
              type="text"
              id="phone"
              placeholder="请输入手机号"
              maxlength="11"
              required
            />
          </div>

          <div class="input-group">
            <label>密码</label>

            <input
              type="password"
              id="password"
              placeholder="请输入密码"
              required
            />
          </div>

          <button type="submit" id="loginBtn">登录</button>
        </form>

        <div class="login-link">
          <a href="#">立即注册</a>

          <span>|</span>

          <a href="#">忘记密码？</a>
        </div>
        <div class="login-link">
          <a href="/Admin/index.html">管理员登录入口</a>
          <span>|</span>
          <a href="/Worker/login.html">维修人员登录入口</a>
        </div>
      </div>
    </section>

    <!-- 底部 -->
    <footer>
      <p>市政设施报修平台</p>

      <p>Copyright © 2026 Municipal Repair System</p>
    </footer>

    <script src="/js/login2.js"></script>
  </body>
</html>
