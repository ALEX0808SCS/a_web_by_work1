<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>服务评价</title>

    <link rel="stylesheet" href="/css/style2.css" />
  </head>

  <body>
    <div class="page">
      <!-- 顶部 -->

      <header class="page-header">
        <h2>服务评价</h2>
        <a href="/User/home.html" class="back-btn">返回</a>
      </header>

      <!-- 工单信息 -->

      <div class="evaluate-card">
        <h3>工单信息</h3>

        <div class="info-item">
          <span>工单编号：</span>
          <span>RP20260001</span>
        </div>

        <div class="info-item">
          <span>设施类型：</span>
          <span>路灯故障</span>
        </div>

        <div class="info-item">
          <span>维修人员：</span>
          <span>李师傅</span>
        </div>

        <div class="info-item">
          <span>完成时间：</span>
          <span>2026-06-22 15:20</span>
        </div>
      </div>

      <!-- 星级评价 -->

      <div class="evaluate-card">
        <h3>服务评分</h3>

        <div class="star-group">
          <span class="star active">&#9733;</span>
          <span class="star active">&#9733;</span>
          <span class="star active">&#9733;</span>
          <span class="star active">&#9733;</span>
          <span class="star">&#9733;</span>
        </div>
      </div>

      <!-- 标签 -->

      <div class="evaluate-card">
        <h3>评价标签</h3>

        <div class="tag-group">
          <button>维修及时</button>

          <button>服务态度好</button>

          <button>维修专业</button>

          <button>沟通顺畅</button>

          <button>处理速度快</button>
        </div>
      </div>

      <!-- 意见 -->

      <div class="evaluate-card">
        <h3>评价内容</h3>

        <textarea placeholder="请输入您的评价..." rows="6"></textarea>
      </div>

      <!-- 提交 -->

      <div class="submit-box">
        <button id="submitEvaluate">提交评价</button>
      </div>
    </div>

    <script src="/js/evaluate.js"></script>
  </body>
</html>
