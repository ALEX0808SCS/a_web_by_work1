<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我要报修 - 市政设施管理系统</title>

    <link rel="stylesheet" href="/css/style2.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="/js/app.js" defer></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  </head>

  <body>
    <!-- 顶部导航 -->
    <header class="header">
      <div class="logo">
        <i class="fa-solid fa-city"></i>
        <span>市政设施管理系统</span>
      </div>

      <nav class="nav">
        <a href="/User/home.html">
          <i class="fa-solid fa-house"></i>
          首页
        </a>

        <a href="/User/repair.html" class="active">
          <i class="fa-solid fa-screwdriver-wrench"></i>
          我要报修
        </a>

        <a href="/User/myRepair.html">
          <i class="fa-solid fa-list-check"></i>
          我的工单
        </a>

        <a href="/User/profile.html">
          <i class="fa-solid fa-user"></i>
          个人中心
        </a>
      </nav>

      <button class="logout-btn" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>
        退出登录
      </button>
    </header>

    <!-- 主体 -->

    <main class="container">
      <div class="page-title">
        <h2>我要报修</h2>

        <p>请填写以下信息，我们将尽快安排工作人员处理。</p>
      </div>

      <div class="form-card">
        <form id="repairForm">
          <div class="form-group">
            <label>报修类型</label>

            <select id="type">
              <option>请选择报修类型</option>

              <option>路灯损坏</option>

              <option>垃圾桶损坏</option>

              <option>井盖缺失</option>

              <option>道路破损</option>

              <option>排水故障</option>

              <option>绿化损坏</option>

              <option>公共设施损坏</option>

              <option>其他</option>
            </select>
          </div>

          <div class="form-group">
            <label>设施名称</label>

            <input type="text" placeholder="请输入设施名称" />
          </div>

          <div class="form-group">
            <label>报修地点</label>
            <!-- 保存坐标 -->
            <input type="hidden" id="latitude" />
            <input type="hidden" id="longitude" />
            <!-- 显示地址 -->
            <input
              type="text"
              id="address"
              placeholder="点击地图选择位置"
              readonly
            />
            <!-- 地图 -->
            <div id="map"></div>
          </div>

          <div class="form-group">
            <label>联系电话</label>

            <input type="tel" placeholder="请输入联系电话" />
          </div>

          <div class="form-group">
            <label>发现时间</label>

            <input type="date" />
          </div>

          <div class="form-group">
            <label>详细描述</label>

            <textarea
              rows="6"
              placeholder="请描述设施损坏情况、位置以及其他需要说明的信息"
            ></textarea>
          </div>

          <div class="form-group">
            <label>上传现场图片</label>

            <input type="file" accept="image/*" />
          </div>

          <div class="button-group">
            <button type="submit" class="submit-btn">
              <i class="fa-solid fa-paper-plane"></i>

              提交报修
            </button>

            <button type="reset" class="reset-btn">
              <i class="fa-solid fa-rotate"></i>

              重置
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- 页脚 -->

    <footer>Copyright © 2026 市政设施管理系统</footer>
  </body>
</html>
