<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人中心 - 市政设施管理系统</title>

    <link rel="stylesheet" href="/css/style2.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <script src="/js/app.js" defer></script>
  </head>

  <body>
    <!-- 顶部导航 -->

    <header class="header">
      <div class="logo">
        <i class="fa-solid fa-city"></i>

        <span>市政设施管理系统</span>
      </div>

      <nav class="nav">
        <a href="/User/home.html">
          <i class="fa-solid fa-house"></i>
          首页
        </a>

        <a href="/User/repair.html">
          <i class="fa-solid fa-screwdriver-wrench"></i>
          我要报修
        </a>

        <a href="/User/myRepair.html">
          <i class="fa-solid fa-list-check"></i>
          我的工单
        </a>

        <a href="/User/profile.html" class="active">
          <i class="fa-solid fa-user"></i>
          个人中心
        </a>
      </nav>

      <button class="logout-btn" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i>

        退出登录
      </button>
    </header>

    <!-- 主体 -->

    <main class="container">
      <div class="page-title">
        <h2>个人中心</h2>

        <p>查看和管理您的个人信息</p>
      </div>

      <div class="profile-card">
        <!-- 左侧头像 -->

        <div class="profile-left">
          <div class="avatar">
            <i class="fa-solid fa-user"></i>
          </div>

          <h3>普通用户</h3>

          <p>欢迎使用市政设施管理系统</p>
        </div>

        <!-- 右侧信息 -->

        <div class="profile-right">
          <div class="info-item">
            <span class="label">用户名</span>

            <span class="value">user001</span>
          </div>

          <div class="info-item">
            <span class="label">真实姓名</span>

            <span class="value">张三</span>
          </div>

          <div class="info-item">
            <span class="label">联系电话</span>

            <span class="value">138****8888</span>
          </div>

          <div class="info-item">
            <span class="label">累计报修</span>

            <span class="value">15 次</span>
          </div>

          <div class="profile-buttons">
            <button class="primary-btn" onclick="editProfile()">
              <i class="fa-solid fa-user-pen"></i>

              修改资料
            </button>

            <button class="warning-btn" onclick="changePassword()">
              <i class="fa-solid fa-key"></i>

              修改密码
            </button>
          </div>
        </div>
      </div>

      <!-- 数据统计 -->

      <div class="statistics">
        <div class="stat-card">
          <i class="fa-solid fa-file-circle-plus"></i>

          <h3>15</h3>

          <p>累计报修</p>
        </div>

        <div class="stat-card">
          <i class="fa-solid fa-clock"></i>

          <h3>2</h3>

          <p>处理中</p>
        </div>

        <div class="stat-card">
          <i class="fa-solid fa-circle-check"></i>

          <h3>12</h3>

          <p>已完成</p>
        </div>

        <div class="stat-card">
          <i class="fa-solid fa-hourglass-half"></i>

          <h3>1</h3>

          <p>待受理</p>
        </div>
      </div>
    </main>

    <!-- 页脚 -->

    <footer>Copyright © 2026 市政设施管理系统</footer>
  </body>
</html>
